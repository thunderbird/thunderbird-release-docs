name: Publish site

# Builds the site and the generated reports, and publishes them to GitHub Pages.
# Requires Settings > Pages > Source to be "GitHub Actions".
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * *"  # daily, so the reports pick up new releases
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.repository == 'thunderbird/thunderbird-release-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout the repository.
      pages: read     # Required by configure-pages to read the Pages config.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    - name: Generate on-schedule report
      working-directory: reports
      run: >-
        uvx --from git+https://github.com/thunderbird/thunderbird-release-tools
        tb-release on-schedule --jekyll --start-date 2026-01-01 --missing
    - name: Generate Bugzilla queries report
      working-directory: reports
      run: >-
        uvx --from git+https://github.com/thunderbird/thunderbird-release-tools
        tb-release bugzilla-queries --jekyll
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
    - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # Required to deploy to GitHub Pages.
      id-token: write  # Required to verify the deployment originates from this workflow.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

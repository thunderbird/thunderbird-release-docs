<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="icon" href="{{ site.baseurl }}/assets/images/logo.png">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/assets/images/logo.png" alt="" width="32" height="32">
      Thunderbird Release Docs
    </a>
    <div class="search">
      <input id="search-input" type="search" placeholder="Search docs"
             autocomplete="off" aria-label="Search docs">
      <ul id="search-results"></ul>
    </div>
    <a class="repo"href="https://github.com/thunderbird/thunderbird-release-docs">GitHub</a>
  </header>

  <div class="container">
    <nav class="sidebar">
      {% for section in site.data.nav %}
      <h2><a href="{{ site.baseurl }}/{{ section.url }}">{{ section.title }}</a></h2>
      <ul>
        {% for item in section.pages %}
          <li><a href="{{ site.baseurl }}/{{ item.url | replace: '.md', '.html' }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      {% endfor %}
    </nav>

    <main class="content">
      {{ content }}
    </main>
  </div>

  <script>
    // Highlight the current page in the sidebar.
    for (const link of document.querySelectorAll(".sidebar a")) {
      if (link.pathname === location.pathname) {
        link.classList.add("active");
      }
    }

    // Turn GitHub-style alerts (> [!NOTE], > [!WARNING], ...) into callouts.
    for (const quote of document.querySelectorAll("main blockquote")) {
      const first = quote.firstElementChild;
      const match = first?.textContent.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/);
      if (!match) continue;

      const type = match[1].toLowerCase();
      first.firstChild.textContent = first.firstChild.textContent.replace(match[0], "");
      quote.classList.add("alert", `alert-${type}`);

      const title = document.createElement("p");
      title.className = "alert-title";
      title.textContent = type[0].toUpperCase() + type.slice(1);
      quote.prepend(title);
    }
  </script>

  <script src="https://unpkg.com/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
  <script>
    // Search box, backed by the index generated from search.json.
    SimpleJekyllSearch({
      searchInput: document.getElementById("search-input"),
      resultsContainer: document.getElementById("search-results"),
      json: "{{ site.baseurl }}/search.json",
      searchResultTemplate: '<li><a href="{url}">{title}<span class="path">{path}</span></a></li>',
      noResultsText: '<li class="empty">No results</li>',
      limit: 10,
    });
  </script>
</body>
</html>
